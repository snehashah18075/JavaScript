<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoutineFlow — Smart To-Do & Alarm Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1>RoutineFlow</h1>
      <p class="tagline">Schedule your day. Study, sleep, work, fitness &amp; more — all in one calm list.</p>
    </header>

    <section class="add-card">
      <form id="taskForm">
        <div class="field field-text">
          <label for="taskText">Task</label>
          <input type="text" id="taskText" placeholder="e.g. Revise Data Mining Unit 3" required>
        </div>

        <div class="field field-category">
          <label for="taskCategory">Category</label>
          <select id="taskCategory">
            <option value="study">📚 Study</option>
            <option value="sleep">🌙 Sleep</option>
            <option value="work">💼 Work</option>
            <option value="fitness">🏋️ Fitness</option>
            <option value="custom">✦ Custom</option>
          </select>
        </div>

        <div class="field field-time">
          <label for="taskTime">Alarm time</label>
          <input type="datetime-local" id="taskTime" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">Add Task</button>
      </form>
    </section>

    <section class="filter-bar" id="filterBar">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="study">Study</button>
      <button class="filter-chip" data-filter="sleep">Sleep</button>
      <button class="filter-chip" data-filter="work">Work</button>
      <button class="filter-chip" data-filter="fitness">Fitness</button>
      <button class="filter-chip" data-filter="custom">Custom</button>
    </section>

    <section class="list-wrap">
      <ul id="taskList" class="task-list"></ul>
      <p id="emptyState" class="empty-state">No tasks scheduled yet. Add your first routine item above.</p>
    </section>
  </div>

<script src="script.js"></script>
</body>
</html>
