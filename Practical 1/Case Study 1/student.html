<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Information</title>

<style>

:root{
    --cardinal-red:#8C1515;
    --cool-gray:#4D4F53;
    --light-gray:#F4F4F2;
    --white:#FFFFFF;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    height:100%;
}

body{

    min-height:100vh;

    display:flex;
    flex-direction:column;

    font-family:'Times New Roman', Times, serif;
    color:var(--cool-gray);

    background:
        linear-gradient(rgba(255,255,255,.94),rgba(255,255,255,.94)),
        url("https://www.transparenttextures.com/patterns/cubes.png");

    background-color:#f5f5f5;

}

h1,h2{
    color:var(--cardinal-red);
}

/*---------------- Identity Bar ----------------*/

.identity-bar{

    background:var(--cardinal-red);
    color:white;

    text-align:center;

    font-size:12px;

    padding:5px;

    letter-spacing:1px;
}

/*---------------- Header ----------------*/

header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:12px 40px;

    background:white;

    border-bottom:1px solid #ddd;
}

.logo-area{

    display:flex;

    align-items:center;

    gap:10px;
}

.logo-area img{

    height:36px;

    width:36px;
}

.logo-text{

    font-size:20px;

    color:var(--cardinal-red);

    font-weight:bold;
}

nav ul{

    list-style:none;

    display:flex;

    gap:28px;
}

nav a{

    text-decoration:none;

    color:var(--cool-gray);

    font-weight:bold;

    font-size:15px;
}

nav a:hover{

    color:var(--cardinal-red);

    text-decoration:underline;
}

/*---------------- Banner ----------------*/

.banner {
    background-color: var(--cardinal-red);
    color: var(--white);
    text-align: center;
    padding: 40px 20px;
}

.banner h1 {
    color: var(--white);
    font-size: 32px;
    margin-bottom: 8px;
}

.banner p {
    color: #f5f5f5;
    font-style: italic;
    font-size: 15px;
}
/*---------------- Main ----------------*/

main{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}

.card{

    width:720px;

    background:white;

    padding:25px;

    border-radius:12px;

    box-shadow:0 8px 20px rgba(0,0,0,.12);

    text-align:center;
}

/*---------------- Button ----------------*/

.btn{

    background:var(--cardinal-red);

    color:white;

    border:none;

    padding:12px 28px;

    font-size:15px;

    font-weight:bold;

    border-radius:5px;

    cursor:pointer;

    margin-bottom:20px;

    transition:.3s;
}

.btn:hover{

    background:#6e1010;
}

/*---------------- Table ----------------*/

table{

    width:100%;

    border-collapse:collapse;

    overflow:hidden;

    border-radius:8px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

th,td{

    padding:10px 16px;

    text-align:left;

    border:1px solid #ddd;

    font-size:15px;
}

th{

    width:35%;

    background:var(--cardinal-red);

    color:white;
}

td{

    background:var(--light-gray);
}

tr:nth-child(even) td{

    background:#ececea;
}

/*---------------- Footer ----------------*/

footer{

    background:var(--cardinal-red);

    color:white;

    text-align:center;

    padding:12px;

    font-size:12px;
}

</style>

</head>
