<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id = "result"></p>
    <script>
        try{
            let num = 10;
            let result = num.toUpperCase();
            document.getElementById("result").innerHTML = result;
        }
        catch(error){
            document.getElementById("result").innerHTML = "An error occured: "+ error.message;
        }
    </script>
</body>
</html>
